<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sportsEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120E" />
      <stop offset="50%" stop-color="#0F291E" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="goldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sportsEmerald)" />
  <circle cx="680" cy="90" r="180" fill="url(#goldAmber)" fill-opacity="0.25" />
  <circle cx="120" cy="380" r="160" fill="#10B981" fill-opacity="0.2" />

  <!-- Track Curves -->
  <g stroke="#34D399" stroke-width="2" stroke-opacity="0.3" fill="none">
    <path d="M 0 320 Q 300 240 500 320 T 800 280" />
    <path d="M 0 350 Q 300 270 500 350 T 800 310" />
    <path d="M 0 380 Q 300 300 500 380 T 800 340" />
  </g>

  <!-- Trophy Icon Badge -->
  <g transform="translate(400, 150)">
    <circle cx="0" cy="0" r="44" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    <path d="M -16 -16 L 16 -16 L 12 6 C 10 14 -10 14 -12 6 Z" fill="#F59E0B" />
    <path d="M -22 -12 C -22 -6 -16 -4 -16 -4 M 22 -12 C 22 -6 16 -4 16 -4" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <rect x="-4" y="14" width="8" height="10" fill="#34D399" />
    <rect x="-12" y="24" width="24" height="4" rx="2" fill="#34D399" />
  </g>

  <text x="400" y="275" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Sports &amp; Fitness Championship</text>
  <text x="400" y="310" font-family="'Inter', sans-serif" font-size="15" fill="#D1FAE5" text-anchor="middle">Marathons · Tournaments · Athletic Contests</text>
  <rect x="335" y="338" width="130" height="28" rx="14" fill="#10B981" fill-opacity="0.25" stroke="#34D399" stroke-width="1.5" />
  <text x="400" y="357" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ECFDF5" text-anchor="middle">LIVE SPORTS</text>
</svg>

